# 4–5 line first-person intros. Written with the write-intros skill; approved by Ioannis.
# Variant A of each is stored here; both variants are in source-material/_intro-drafts.md.
intro:
  home: "I came to data and software through physics. At Aristotle University of Thessaloniki I studied physics and then computational physics, and my Bachelor's thesis took me from rotating neutron stars to writing a Python interface for the RNS code and running it on the university's HPC cluster. Between 2015 and 2020 I also tutored high-school students in physics, helping them prepare for their exams. I keep learning alongside my work: over the past year I have completed courses on Oracle database architecture, PL/SQL, SQL performance tuning and Claude Code. Away from the screen, I play basketball, train in boxing and read."
  work: 'My work sits where data, reporting and integration meet. At Deloitte I built and maintained BI Publisher reports for Oracle HCM Cloud, optimised complex SQL and PL/SQL, ran SFTP/FTP file pipelines and worked with colleagues on Oracle Integration Cloud workflows. Moving from computational physics into enterprise data, and now to Netcompany-Intrasoft, has meant learning new systems and settling into new teams quickly. I keep investing in the fundamentals, most recently Oracle database architecture, PL/SQL and SQL performance tuning.'
  academic: "I studied physics at Aristotle University of Thessaloniki and then specialised in computational physics in my Master's. My Bachelor's thesis studied rotating neutron stars with the RNS code: I wrote a Python GUI to configure, run and plot the models, and deployed the simulations on the university's HPC cluster. The Master's took me into simulations in electromagnetics, quantum mechanics and materials, and my thesis used density functional theory in CP2K to find the ground states of bioactive molecules. What draws me is using computation to make physical problems understandable."
