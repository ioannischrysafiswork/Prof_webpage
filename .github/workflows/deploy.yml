name: Deploy to GitHub Pages

# Every push to `main` deploys (Settings → Pages → Source: "GitHub Actions").
# It can also be run manually from Actions → Deploy to GitHub Pages → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # User site (CLAUDE.md §3.1): clean URLs at the root.
  SITE_URL: https://ioannischrysafiswork.github.io
  BASE_PATH: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
