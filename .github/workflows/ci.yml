name: CI

# Build, type-check and lint every push and pull request, so main always stays deployable.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://ioannischrysafiswork.github.io
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run lint
      - run: npm run build
      - name: Structural check of dist/
        run: node .claude/skills/site-preflight/scripts/check-dist.mjs
